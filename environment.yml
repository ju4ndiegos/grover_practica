# Entorno conda para la práctica de Grover.
#   conda env create -f environment.yml
#   conda activate grover-practica
name: grover-practica
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - qiskit>=2.0
      - qiskit-aer>=0.17
      - numpy>=1.26
      - matplotlib>=3.8
      - pylatexenc>=2.10
      - jupyterlab>=4.0
      - ipykernel>=6.29
      - ipywidgets>=8.1
