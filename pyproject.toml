[project]
name = "grover-practica"
version = "0.1.0"
description = "Práctica guiada del algoritmo de Grover: compuerta MCZ, oracles, difusor e iteraciones."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pylatexenc>=2.10",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[tool.uv]
# Solo es un entorno para el notebook; no hay paquete que instalar.
package = false
